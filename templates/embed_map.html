<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Nuclear Database — Reactor Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        #embed-map { position: absolute; inset: 0; background: #F6F6F6; }
        /* Teaser tint: translucent #FFBF00 wash over the map, clicks pass through */
        #tint {
            position: absolute; inset: 0; z-index: 500;
            background: rgba(255, 191, 0, 0.28);
            pointer-events: none;
        }
        .leaflet-control-attribution { font-size: 9px; }
    </style>
</head>
<body>
    <div id="embed-map"></div>
    <div id="tint"></div>
    <script>
        // rows: [lat, lng, status, capacity_mw, plant_name]
        const rows = {{ reactor_rows | tojson }};
        const params = new URLSearchParams(window.location.search);
        if (params.get('tint') === '0') document.getElementById('tint').style.display = 'none';

        const statusColors = {
            'Operational':         '#40774A',
            'Under Construction':  '#3F55C5',  // REG cobalt (yellow reads as tint-colored)
            'Suspended':           '#E06336',
            'Long-term Shutdown':  '#9FC3A5',
            'Shutdown':            '#474853'
        };
        const statusPriority = {
            'Operational': 1, 'Under Construction': 2, 'Suspended': 3,
            'Long-term Shutdown': 4, 'Shutdown': 5
        };

        const map = L.map('embed-map', {
            scrollWheelZoom: false,
            attributionControl: true,
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            worldCopyJump: false
        });

        // Frame the reactor fleet: no Antarctica, nothing north of the
        // northernmost Russian reactors, longitude clipped to the data.
        let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
        rows.forEach(([lat, lng]) => {
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
            if (lng < minLng) minLng = lng;
            if (lng > maxLng) maxLng = lng;
        });
        const bounds = L.latLngBounds([minLat, minLng], [maxLat, maxLng]);
        map.fitBounds(bounds, { padding: [12, 12] });
        map.setMaxBounds(bounds.pad(0.05));
        map.setMinZoom(map.getZoom());

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri, HERE, Garmin, &copy; OpenStreetMap'
        }).addTo(map);

        // Group reactors into plant sites (same rule as the dashboard map)
        const sites = {};
        rows.forEach(([lat, lng, status, cap]) => {
            const key = lat.toFixed(4) + ',' + lng.toFixed(4);
            if (!sites[key]) sites[key] = { lat, lng, statuses: [], capacity: 0 };
            sites[key].statuses.push(status);
            sites[key].capacity += cap;
        });

        Object.values(sites).forEach(site => {
            const best = site.statuses.reduce((a, b) =>
                (statusPriority[a] || 99) <= (statusPriority[b] || 99) ? a : b);
            L.circleMarker([site.lat, site.lng], {
                radius: Math.max(3, Math.min(10, Math.sqrt(site.capacity) / 12)),
                color: '#fff', weight: 1,
                fillColor: statusColors[best] || '#3F55C5',
                fillOpacity: 0.85,
                interactive: false
            }).addTo(map);
        });
    </script>
</body>
</html>
