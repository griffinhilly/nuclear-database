<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Nuclear Database — Reactor Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        /* Duotone brand map: Nuclear Yellow water, yellow-accent land (designer spec) */
        #embed-map { position: absolute; inset: 0; background: #FFBF00; }
        .leaflet-control-attribution {
            font-size: 9px; color: #474853;
            background: rgba(255, 191, 0, 0.75) !important;
        }
        .leaflet-control-attribution a { color: #474853; }
        /* Brand the zoom control: dark grey on yellow, flat */
        .leaflet-control-zoom a {
            background: #FFBF00 !important; color: #474853 !important;
            border-color: #C79500 !important;
        }
        .leaflet-control-zoom a:hover { background: #FFD24D !important; }
        .leaflet-bar { border: 1px solid #C79500 !important; box-shadow: none !important; }
    </style>
</head>
<body>
    <div id="embed-map"></div>
    <script>
        // rows: [lat, lng, status, capacity_mw, plant_name]
        const rows = {{ reactor_rows | tojson }};

        const statusColors = {
            'Operational':         '#40774A',  // Forest Green
            'Under Construction':  '#3F55C3',  // Cobalt Blue
            'Suspended':           '#DF6336',  // Vermilion
            'Long-term Shutdown':  '#9DC1A3',  // Sage Green
            'Shutdown':            '#474853'   // Dark Grey
        };
        const statusPriority = {
            'Operational': 1, 'Under Construction': 2, 'Suspended': 3,
            'Long-term Shutdown': 4, 'Shutdown': 5
        };

        const map = L.map('embed-map', {
            scrollWheelZoom: false,
            attributionControl: true,
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            worldCopyJump: false
        });
        map.attributionControl.setPrefix(false);

        // Panning is bounded by the full reactor fleet…
        let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
        rows.forEach(([lat, lng]) => {
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
            if (lng < minLng) minLng = lng;
            if (lng > maxLng) maxLng = lng;
        });
        const fleetBounds = L.latLngBounds([minLat, minLng], [maxLat, maxLng]);

        // …but the default view is a COVER fit of the Figma prototype's world
        // view (~75N–55S, near-full longitude): land fills the frame, edges
        // crop before empty ocean does, north-biased since the southern
        // hemisphere holds few reactors (designer + Griffin feedback Jul 21).
        const targetBounds = L.latLngBounds([-55, -170], [75, 180]);
        map.setMaxBounds(fleetBounds.extend(targetBounds).pad(0.1));
        map.setMinZoom(map.getBoundsZoom(fleetBounds));
        map.fitBounds(targetBounds);                          // sets Mercator-correct center
        map.setZoom(map.getBoundsZoom(targetBounds, true));   // then zoom to cover, not contain

        // Flat country choropleth — no raster tiles (Natural Earth 110m, public
        // domain). Colors sampled from the Figma prototype (Jul 21): nuclear
        // countries (properties.n=1, baked from the DB) darker than the rest.
        fetch('/static/ne_110m_countries_nuclear.geojson')
            .then(r => r.json())
            .then(countries => {
                L.geoJSON(countries, {
                    style: f => ({
                        fillColor: f.properties.n ? '#C79500' : '#EBB000',
                        fillOpacity: 1,
                        color: '#FFBF00', weight: 0.5,   // faint borders in the bg yellow
                        interactive: false
                    })
                }).addTo(map).bringToBack();
            });
        map.attributionControl.addAttribution('Natural Earth');

        // Group reactors into plant sites (same rule as the dashboard map)
        const sites = {};
        rows.forEach(([lat, lng, status, cap]) => {
            const key = lat.toFixed(4) + ',' + lng.toFixed(4);
            if (!sites[key]) sites[key] = { lat, lng, statuses: [], capacity: 0 };
            sites[key].statuses.push(status);
            sites[key].capacity += cap;
        });

        Object.values(sites).forEach(site => {
            const best = site.statuses.reduce((a, b) =>
                (statusPriority[a] || 99) <= (statusPriority[b] || 99) ? a : b);
            L.circleMarker([site.lat, site.lng], {
                radius: Math.max(3, Math.min(10, Math.sqrt(site.capacity) / 12)),
                color: '#FFBF00', weight: 1,
                fillColor: statusColors[best] || '#474853',
                fillOpacity: 0.95,
                interactive: false
            }).addTo(map);
        });
    </script>
</body>
</html>
