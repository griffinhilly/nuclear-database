<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Lineages &mdash; Global Nuclear Database</title>


    <!-- REG shared brand stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='reg.css') }}">

    <style>
        /* Page-specific overrides — design lineages */

        /* Filter tabs (pill-row above the grid) */
        .filter-bar {
            display: flex;
            gap: 6px;
            margin: 8px 0 28px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--hairline);
            padding-bottom: 0;
        }
        .filter-btn {
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: var(--font-sans);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s;
        }
        .filter-btn:hover { color: var(--reg-grey-dark); }
        .filter-btn.active {
            color: var(--reg-grey-dark);
            border-bottom: 2px solid var(--reg-yellow);
        }

        /* Lineage grid */
        .lineage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 16px;
        }

        .lineage-card {
            background: #ffffff;
            border: 1px solid var(--hairline);
            border-left: 3px solid var(--reg-blue-cobalt);
            padding: 22px 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: background 0.15s, border-left-color 0.15s;
        }
        .lineage-card:hover {
            background: var(--reg-grey-light);
            border-left-color: var(--reg-yellow);
        }

        .lineage-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .lineage-card h3 {
            font-family: var(--font-sans);
            color: var(--reg-grey-dark);
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: -0.005em;
            margin: 0;
        }

        .lineage-card .tech-badge {
            display: inline-block;
            padding: 3px 10px;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            background: var(--reg-grey-dark);
            color: #fff;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
        }

        .lineage-card .origin {
            color: var(--text-secondary);
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .lineage-card .description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.55;
            margin-bottom: 18px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .lineage-card .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding-top: 14px;
            border-top: 1px solid var(--hairline);
        }

        .lineage-card .stat {
            text-align: left;
            padding-right: 10px;
            border-right: 1px solid var(--hairline);
        }
        .lineage-card .stat:last-child { border-right: none; }

        .lineage-card .stat-num {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 300;
            color: var(--reg-grey-dark);
            line-height: 1;
            letter-spacing: -0.01em;
        }

        .lineage-card .stat-num.op { color: var(--reg-green-forest); }
        .lineage-card .stat-num.uc { color: var(--reg-yellow); }

        .lineage-card .stat-lbl {
            font-size: 0.6rem;
            color: var(--text-secondary);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-top: 8px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .lineage-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    {% include '_reg_nav.html' %}

    <div class="reg-page-header">
        <div class="reg-page-header-inner">
            <a href="/" class="reg-back-link">&larr; Back to Dashboard</a>
            <h1 class="reg-page-title">Reactor Design Lineages</h1>
            <p class="reg-page-subtitle">24 design families spanning 70 years of nuclear engineering.</p>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            Loading lineage data...
        </div>

        <div id="content" style="display: none;">
            <div class="stats-row" id="quick-stats"></div>

            <div class="filter-bar" id="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="PWR">PWR</button>
                <button class="filter-btn" data-filter="BWR">BWR</button>
                <button class="filter-btn" data-filter="PHWR">PHWR</button>
                <button class="filter-btn" data-filter="GCR">GCR</button>
                <button class="filter-btn" data-filter="other">Other</button>
            </div>

            <div class="lineage-grid" id="lineage-grid"></div>
        </div>
    </div>

    {% include '_reg_footer.html' %}

    <script>
        let allLineages = [];
        const mainTypes = ['PWR', 'BWR', 'PHWR', 'GCR'];

        async function load() {
            try {
                const res = await fetch('/api/lineages');
                const data = await res.json();
                allLineages = data.lineages;
                render(allLineages);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').innerHTML = 'Failed to load data. <a href="/">Return to dashboard</a>';
            }
        }

        function render(lineages) {
            // Quick stats
            const totalReactors = lineages.reduce((s, l) => s + l.reactor_count, 0);
            const totalOp = lineages.reduce((s, l) => s + l.operational, 0);
            const totalGW = lineages.reduce((s, l) => s + l.capacity_gw, 0);
            const totalSeries = lineages.reduce((s, l) => s + l.series_count, 0);

            document.getElementById('quick-stats').innerHTML = `
                <div class="mini-stat">
                    <div class="mini-stat-value">${lineages.length}</div>
                    <div class="mini-stat-label">Design Families</div>
                </div>
                <div class="mini-stat">
                    <div class="mini-stat-value">${totalSeries}</div>
                    <div class="mini-stat-label">Design Series</div>
                </div>
                <div class="mini-stat">
                    <div class="mini-stat-value">${totalReactors.toLocaleString()}</div>
                    <div class="mini-stat-label">Total Reactors</div>
                </div>
                <div class="mini-stat">
                    <div class="mini-stat-value">${totalOp.toLocaleString()}</div>
                    <div class="mini-stat-label">Operational</div>
                </div>
                <div class="mini-stat">
                    <div class="mini-stat-value">${totalGW.toFixed(1)}</div>
                    <div class="mini-stat-label">Capacity (GW)</div>
                </div>
            `;

            // Grid
            document.getElementById('lineage-grid').innerHTML = lineages.map(l => `
                <a href="/lineage/${l.slug}" class="lineage-card" data-tech="${l.technology_type}">
                    <div class="lineage-card-header">
                        <h3>${l.name}</h3>
                        <span class="tech-badge">${l.technology_type}</span>
                    </div>
                    <div class="origin">${l.origin_country} &middot; ${l.original_designer}</div>
                    <div class="description">${l.description || ''}</div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-num">${l.reactor_count}</div>
                            <div class="stat-lbl">Reactors</div>
                        </div>
                        <div class="stat">
                            <div class="stat-num op">${l.operational}</div>
                            <div class="stat-lbl">Operating</div>
                        </div>
                        <div class="stat">
                            <div class="stat-num uc">${l.under_construction}</div>
                            <div class="stat-lbl">Building</div>
                        </div>
                        <div class="stat">
                            <div class="stat-num">${l.capacity_gw}</div>
                            <div class="stat-lbl">GW</div>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        // Filter
        document.getElementById('filter-bar').addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const filter = btn.dataset.filter;
            if (filter === 'all') {
                render(allLineages);
            } else if (filter === 'other') {
                render(allLineages.filter(l => !mainTypes.includes(l.technology_type)));
            } else {
                render(allLineages.filter(l => l.technology_type === filter));
            }
        });

        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
